<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>stage</title>
<style>
  @font-face { font-family: "StagePretendard"; src: url("/__stage/p500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "StagePretendard"; src: url("/__stage/p600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "StagePretendard"; src: url("/__stage/p700.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000947; }
  body { font-family: "StagePretendard", "Malgun Gothic", sans-serif; }
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: translate(0px, 0px) scale(1); }
  #app { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: #fff; }
  .ov { position: absolute; left: 0; top: 0; pointer-events: none; }

  /* 강조 테두리: 바깥을 어둡게 덮는 큰 그림자와 파란 테두리 */
  #ring { opacity: 0; border-radius: 10px; box-sizing: border-box;
    box-shadow: 0 0 0 3px #3D6BFF, 0 0 0 7px rgba(61, 107, 255, 0.28), 0 0 0 4000px rgba(0, 9, 71, 0);
    transition: opacity 260ms cubic-bezier(.4,0,.2,1), box-shadow 320ms cubic-bezier(.4,0,.2,1), transform 420ms cubic-bezier(.22,1,.36,1),
      left 420ms cubic-bezier(.22,1,.36,1), top 420ms cubic-bezier(.22,1,.36,1), width 420ms cubic-bezier(.22,1,.36,1), height 420ms cubic-bezier(.22,1,.36,1);
    transform: scale(1.04); }
  #ring.on { opacity: 1; transform: scale(1); }
  #ring.dim { box-shadow: 0 0 0 3px #3D6BFF, 0 0 0 7px rgba(61, 107, 255, 0.28), 0 0 0 4000px rgba(0, 9, 71, 0.42); }

  /* 커서 */
  #cursor { width: 0; height: 0; transform: translate(960px, 620px); z-index: 5; }
  #cursor .ci { position: absolute; left: -4px; top: -3px; width: 30px; height: 30px; transform-origin: 4px 3px; transform: scale(1);
    transition: transform 140ms cubic-bezier(.4,0,.2,1); filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  #cursor.down .ci { transform: scale(.86); }
  #cursor .ck { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* 클릭 물결 */
  .ripple { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(61, 107, 255, 0.30); box-shadow: 0 0 0 2px rgba(61, 107, 255, 0.55) inset; animation: rip 520ms cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes rip { from { transform: scale(.25); opacity: 1; } to { transform: scale(1.15); opacity: 0; } }

  /* 자막 (화면에 고정) */
  #cap { position: fixed; left: 50%; bottom: 54px; transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
    transition: opacity 320ms cubic-bezier(.4,0,.2,1), transform 420ms cubic-bezier(.22,1,.36,1);
    display: flex; align-items: center; gap: 14px; padding: 13px 26px 13px 14px; border-radius: 999px;
    background: rgba(0, 9, 71, 0.94); color: #fff; box-shadow: 0 10px 34px rgba(0, 9, 71, 0.35), 0 0 0 1px rgba(255,255,255,.10) inset;
    font-size: 23px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; z-index: 20; }
  #cap.on { opacity: 1; transform: translate(-50%, 0); }
  #cap .no { flex: none; min-width: 34px; height: 34px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; background: #3D6BFF; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #cap .sub { font-weight: 500; color: rgba(255,255,255,.72); }

  /* 빠르게 감기 표시 */
  #ff { position: fixed; right: 44px; top: 40px; opacity: 0; pointer-events: none; transition: opacity 240ms;
    padding: 9px 18px; border-radius: 999px; background: rgba(0, 9, 71, 0.92); color: #fff; font-size: 19px; font-weight: 600; z-index: 20; }
  #ff.on { opacity: 1; }

  /* 처음·끝의 막 */
  #curtain { position: fixed; inset: 0; background: #000947; opacity: 1; pointer-events: none; transition: opacity 600ms cubic-bezier(.4,0,.2,1); z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  #curtain.off { opacity: 0; }
  #curtain .t1 { font-size: 64px; line-height: 80px; font-weight: 700; letter-spacing: -0.02em; }
  #curtain .t2 { margin-top: 14px; font-size: 26px; line-height: 36px; font-weight: 500; color: rgba(255,255,255,.72); }
</style>
</head>
<body>
<div id="cam">
  <iframe id="app" name="app" src="about:blank"></iframe>
  <div id="ring" class="ov"></div>
  <div id="ripples" class="ov"></div>
  <div id="cursor" class="ov"><div class="ck"><div class="ci">
    <svg viewBox="0 0 30 30" width="30" height="30"><path d="M4 3 L4 23.5 L9.4 18.6 L13.1 27 L16.6 25.5 L13 17.2 L20.4 17.2 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div></div></div>
</div>
<div id="cap"></div>
<div id="ff"></div>
<div id="curtain"><div class="t1"></div><div class="t2"></div></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const cam = $("cam"), ring = $("ring"), cursor = $("cursor"), ck = cursor.querySelector(".ck"), cap = $("cap"), ff = $("ff"), curtain = $("curtain");
  const state = { cx: 960, cy: 620, tx: 0, ty: 0, s: 1 };
  /* 느린 동작 촬영의 배수: CSS 움직임은 브라우저가 느리게 돌리고, 여기의 타이머만 직접 늘린다. */
  const SLOW = Number("__SLOW__") || 1;
  window.stage = {
    state,
    load(url) { $("app").src = url; },
    /** 카메라: 화면 = translate(tx,ty) scale(s). 커서는 확대의 제곱근만큼만 커진다. */
    cam(tx, ty, s, ms, ease) {
      const e = ease || "cubic-bezier(.62,.02,.2,1)";
      cam.style.transition = ms > 0 ? `transform ${ms}ms ${e}` : "none";
      ck.style.transition = ms > 0 ? `transform ${ms}ms ${e}` : "none";
      cam.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      ck.style.transform = `scale(${1 / Math.sqrt(s)})`;
      Object.assign(state, { tx, ty, s });
    },
    cursorTo(x, y, ms, ease) {
      cursor.style.transition = ms > 0 ? `transform ${ms}ms ${ease || "cubic-bezier(.45,.05,.2,1)"}` : "none";
      cursor.style.transform = `translate(${x}px, ${y}px)`;
      state.cx = x; state.cy = y;
    },
    cursorShow(on) { cursor.style.opacity = on ? "1" : "0"; },
    press() {
      cursor.classList.add("down");
      const r = document.createElement("div");
      r.className = "ripple"; r.style.left = state.cx + "px"; r.style.top = state.cy + "px";
      $("ripples").appendChild(r);
      setTimeout(() => cursor.classList.remove("down"), 150 * SLOW);
      setTimeout(() => r.remove(), 700 * SLOW);
    },
    ring(x, y, w, h, opts) {
      const o = opts || {};
      const wasOn = ring.classList.contains("on");
      if (!wasOn) ring.style.transitionProperty = "opacity, box-shadow, transform";
      else ring.style.transitionProperty = "";
      ring.style.left = x + "px"; ring.style.top = y + "px"; ring.style.width = w + "px"; ring.style.height = h + "px";
      ring.style.borderRadius = (o.radius ?? 10) + "px";
      void ring.offsetWidth;
      ring.classList.add("on");
      ring.classList.toggle("dim", !!o.dim);
    },
    unring() { ring.classList.remove("on"); ring.classList.remove("dim"); },
    caption(no, text, sub) {
      if (text == null) { cap.classList.remove("on"); return; }
      cap.innerHTML = "";
      if (no != null && no !== "") { const n = document.createElement("span"); n.className = "no"; n.textContent = no; cap.appendChild(n); }
      else cap.style.paddingLeft = "26px";
      if (no != null && no !== "") cap.style.paddingLeft = "14px";
      const t = document.createElement("span"); t.textContent = text; cap.appendChild(t);
      if (sub) { const s = document.createElement("span"); s.className = "sub"; s.textContent = sub; cap.appendChild(s); }
      cap.classList.add("on");
    },
    ff(text) { if (text) { ff.textContent = text; ff.classList.add("on"); } else ff.classList.remove("on"); },
    curtain(on, ms, t1, t2) {
      curtain.style.transitionDuration = (ms ?? 600) + "ms";
      curtain.querySelector(".t1").textContent = t1 || "";
      curtain.querySelector(".t2").textContent = t2 || "";
      curtain.classList.toggle("off", !on);
    },
  };
})();
</script>
</body>
</html>
